<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Izaaly – Espace administrateur</title>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;display:grid;place-items:center;padding:1.5rem;background:#000;color:#fff;font-family:"Jost",system-ui,sans-serif}
    form{width:100%;max-width:380px;display:grid;gap:1.4rem}
    h1{font-size:1.6rem;font-weight:400;letter-spacing:.3em;text-align:center}
    p.sub{text-align:center;font-weight:300;color:#bbb}
    label{display:grid;gap:.4rem;font-size:.85rem;letter-spacing:.06em;color:#ccc}
    input{font:inherit;font-size:1.05rem;color:#fff;background:none;border:0;border-bottom:1px solid #777;padding:.7rem 0;outline:none}
    input:focus{border-color:#fff}
    button{font:inherit;font-weight:500;letter-spacing:.14em;text-transform:uppercase;padding:1rem;border:1px solid #fff;background:#fff;color:#000;cursor:pointer}
    button:disabled{opacity:.5;cursor:default}
    .err{min-height:1.4em;color:#ff8a8a;text-align:center;font-size:.95rem}
  </style>
</head>
<body>
  <form id="f">
    <h1>IZAALY</h1>
    <p class="sub">Connectez-vous pour modifier votre site.</p>
    <label>E-mail <input type="email" id="email" autocomplete="username" required></label>
    <label>Mot de passe <input type="password" id="pw" autocomplete="current-password" required></label>
    <button type="submit" id="go">Se connecter</button>
    <p class="err" id="err" role="alert"></p>
  </form>
  <script>
    const URL_ = 'https://srrpizqcwjdcgugsavpg.supabase.co';
    const KEY = 'sb_publishable_I9TJahkI44v-deF3tONu1Q_JibgFcSg';
    const f = document.getElementById('f'), err = document.getElementById('err'), go = document.getElementById('go');
    f.addEventListener('submit', async e => {
      e.preventDefault();
      go.disabled = true; err.textContent = '';
      try {
        const r = await fetch(URL_ + '/auth/v1/token?grant_type=password', {
          method: 'POST',
          headers: { apikey: KEY, 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: f.email.value.trim(), password: f.pw.value })
        });
        const j = await r.json();
        if (!r.ok) throw new Error();
        localStorage.setItem('izaaly:session', JSON.stringify({
          access_token: j.access_token,
          refresh_token: j.refresh_token,
          expires_at: j.expires_at || Math.floor(Date.now() / 1000) + j.expires_in
        }));
        location.href = '../index.html?admin';
      } catch (x) {
        err.textContent = 'E-mail ou mot de passe incorrect.';
        go.disabled = false;
      }
    });
  </script>
</body>
</html>
